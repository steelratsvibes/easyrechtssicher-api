name: Examples, contract and secrets
on:
  push:
  pull_request:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Native runtime verification and all five keyless live smokes
        run: |
          php --version
          bash scripts/verify.sh
      - name: Live document list and four samples with all five examples
        run: python3 scripts/probe-smoke.py
  standard-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python3 scripts/spec.py check
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Install pinned gitleaks with release checksum verification
        env:
          VERSION: '8.30.1'
          ARCHIVE_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
        run: |
          set -euo pipefail
          temp_dir="$(mktemp -d)"
          cd "$temp_dir"
          archive="gitleaks_${VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --max-time 60 "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/${archive}" -o "$archive"
          printf '%s  %s\n' "$ARCHIVE_SHA256" "$archive" | sha256sum --check
          tar -xzf "$archive" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
      - name: Scan full Git history and working tree
        run: |
          set -euo pipefail
          test "$(git rev-parse --is-shallow-repository)" = false
          scan_dir="$(mktemp -d)"
          trap 'rm -r -- "$scan_dir"' EXIT
          printf '[extend]\nuseDefault = true\n' > "$scan_dir/config.toml"
          touch "$scan_dir/ignore"
          scan_flags=(--redact=100 --config "$scan_dir/config.toml" --gitleaks-ignore-path "$scan_dir/ignore" --ignore-gitleaks-allow)
          gitleaks git "${scan_flags[@]}" --log-opts=--all .
          gitleaks dir "${scan_flags[@]}" .
